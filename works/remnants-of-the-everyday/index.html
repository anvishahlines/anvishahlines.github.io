        <section>
          <h2>About the Artist</h2>
          <p>Anvi Stevens is a visual artist whose works range from small handheld to large scale painting, drawing, sculptural and textile works. She grew up in Gujarat, India, and currently lives and works in Wakefield, Massachusetts. She received a Bachelor of Visual Arts from Maharaja Sayajirao University of Vadodara, India and a Master of Fine Arts from Boston University. Fabric, often acquired from her mother’s collection, serve as surfaces to dye and paint on. Through hand and machine stitching, and mark making techniques, Anvi uses abstraction to navigate the awkward, complex, and humorous experiences in a social setting that lead to growth and transformation.</p>
        </section>
        <section>
          <h2>Featured Artwork</h2>
          <article>
            <h3>Rooted (2026)</h3>
            <p>Twill tape, embroidery floss, eyelet, water color, color pencil, charcoal, dyed cotton and silk fabric on raw canvas, 61x35 inches.</p>
            <img src="/images/nature-of-things/04_rooted.JPG" alt="Tall vertical textile on raw canvas: chair frame outlined in black-and-white linear woodgrain hatching, backrest formed of green and sage fabric strips with stitched leaf-shaped cord loops and an orange stitched leaf, and lower fringe of vertical fabric ribbons in ochre, purple, blue, beige, and black with metal eyelets." />
          </article>
          <article>
            <h3>Adorned (2026)</h3>
            <p>Oil paint and color pencil on canvas and fabric, 40x16 inches.</p>
            <img src="/images/nature-of-things/05_Adorned.JPG" alt="Vertical painting on canvas divided into two sections: the lower half shows a mottled periwinkle blue wall with a white and gold axonometric line outline of a table; the upper half shows an olive green wall with an arched blue alcove containing wooden shelves displaying a green vase, coral specimen, dark teapot, and pottery vessels." />
          </article>
          <article>
            <h3>The Burden You Carry (2026)</h3>
            <p>Eco-printed fabric, thread, charcoal and acrylic paint on linen towel, 31.5&quot; x 16.5&quot;.</p>
            <img src="/images/nature-of-things/06_The Burden You Carry.JPG" alt="Vertical coarse linen towel with blue and yellow edge stripes, featuring a black line drawing of a chair with a large circular white patch on the seat filled with yellow honeycomb patterns, and horizontal charcoal shading across the base." />
          </article>
          <article>
            <h3>Some blame the air conditioning (2026)</h3>
            <p>Graphite, Thread, Acrylic Paint and Fabric, 30x22 inches.</p>
            <img src="/images/nature-of-things/07_some blame the air conditioning.JPG" alt="Vertical beige fabric hanging on a wooden rod: center features an off-white fabric panel with a black outline of a chair with curved legs, pale yellow wash behind the backrest, an olive green strip on the left, and a pink fabric strip along the bottom with two eyelets." />
          </article>
