name: Auto-Build Website with Gemini

on:
  workflow_dispatch: # Allows you to click a button on GitHub to trigger it manually
  push:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the action can commit files back to your repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_site.py

      - name: Commit and Push Generated Website
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Automated website update via Gemini API" || exit 0
          git push
