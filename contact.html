<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Anvi Stevens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <button class="menu-toggle" aria-label="Open menu">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="logo">ANVI STEVENS</div>
        <div class="spacer"></div>
    </header>

    <div class="mobile-menu">
        <div class="overlay-header">
            <button class="menu-close" aria-label="Close menu">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="logo">ANVI STEVENS</div>
            <div class="spacer"></div>
        </div>
        <nav class="overlay-nav">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </div>

    <main class="page-content">
        <section class="text-block text-center">
            <p>For inquiries, please reach out via email.</p>
            <br>
            <a href="mailto:anvishahlines@gmail.com" class="email-link">anvishahlines@gmail.com</a>
        </section>
    </main>

    <script>
        const menu = document.querySelector('.mobile-menu');
        document.querySelector('.menu-toggle').addEventListener('click', () => menu.classList.add('active'));
        document.querySelector('.menu-close').addEventListener('click', () => menu.classList.remove('active'));
    </script>
</body>
</html>
